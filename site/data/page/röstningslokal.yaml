- find:
  - in: röstningslokaler.json
  - key: LÄNSKOD, KOMMUNKOD, LOKAL, GATUADRESS
  - value: '{lokal}'
  - as: röstningslokal
  - h1:
    - text: '{röstningslokal.LOKAL || Ny röstningslokal}'
  - p:
    - a:
      - href: page:röstningslokaler-översikt
      - text: '< Alla röstningslokaler'
  - form:
    - class: lokal-form
    - to: röstningslokal
    - label:
      - for: LOKAL
      - text: Lokal
    - input:
      - id: LOKAL
      - name: LOKAL
      - type: text
      - value: '{röstningslokal.LOKAL}'
    - label:
      - for: LÄGESBESKRIVNING
      - text: Lägesbeskrivning
    - input:
      - id: LÄGESBESKRIVNING
      - name: LÄGESBESKRIVNING
      - type: text
      - value: '{röstningslokal.LÄGESBESKRIVNING}'
    - label:
      - for: GATUADRESS
      - text: Gatuadress
    - input:
      - id: GATUADRESS
      - name: GATUADRESS
      - type: text
      - value: '{röstningslokal.GATUADRESS}'
    - label:
      - for: ORT
      - text: Ort
    - input:
      - id: ORT
      - name: ORT
      - type: text
      - value: '{röstningslokal.ORT}'
    - label:
      - for: KOMMUN
      - text: Kommun
    - input:
      - id: KOMMUN
      - name: KOMMUN
      - type: text
      - value: '{röstningslokal.KOMMUN}'
    - label:
      - for: KOMMUNKOD
      - text: Kommunkod
    - input:
      - id: KOMMUNKOD
      - name: KOMMUNKOD
      - type: text
      - value: '{röstningslokal.KOMMUNKOD}'
    - label:
      - for: LÄN
      - text: Län
    - input:
      - id: LÄN
      - name: LÄN
      - type: text
      - value: '{röstningslokal.LÄN}'
    - label:
      - for: LÄNSKOD
      - text: Länskod
    - input:
      - id: LÄNSKOD
      - name: LÄNSKOD
      - type: text
      - value: '{röstningslokal.LÄNSKOD}'
    - label:
      - for: VALNÄMND
      - text: Valnämnd
    - input:
      - id: VALNÄMND
      - name: VALNÄMND
      - type: text
      - value: '{röstningslokal.VALNÄMND}'
    - label:
      - for: HEMSIDA
      - text: Hemsida
    - input:
      - id: HEMSIDA
      - name: HEMSIDA
      - type: text
      - value: '{röstningslokal.HEMSIDA}'
    - label:
      - for: TELEFONNUMMER
      - text: Telefon
    - input:
      - id: TELEFONNUMMER
      - name: TELEFONNUMMER
      - type: text
      - value: '{röstningslokal.TELEFONNUMMER}'
    - label:
      - for: LATITUD
      - text: Latitud
    - input:
      - id: LATITUD
      - name: LATITUD
      - type: text
      - value: '{röstningslokal.LATITUD}'
    - label:
      - for: LONGITUD
      - text: Longitud
    - input:
      - id: LONGITUD
      - name: LONGITUD
      - type: text
      - value: '{röstningslokal.LONGITUD}'
    - h2:
      - text: Tillgänglighet
    - label:
      - for: RULLSTOLSANPASSAD_LOKAL
      - text: Rullstolsanpassad lokal
    - input:
      - id: RULLSTOLSANPASSAD_LOKAL
      - name: RULLSTOLSANPASSAD_LOKAL
      - type: text
      - value: '{röstningslokal.RULLSTOLSANPASSAD_LOKAL}'
    - label:
      - for: PARKERING
      - text: Parkering
    - input:
      - id: PARKERING
      - name: PARKERING
      - type: text
      - value: '{röstningslokal.PARKERING}'
    - label:
      - for: EXTRABELYSNING
      - text: Extrabelysning
    - input:
      - id: EXTRABELYSNING
      - name: EXTRABELYSNING
      - type: text
      - value: '{röstningslokal.EXTRABELYSNING}'
    - label:
      - for: FÖRSTORINGSHJALPMEDEL
      - text: Förstoringshjälpmedel
    - input:
      - id: FÖRSTORINGSHJALPMEDEL
      - name: FÖRSTORINGSHJALPMEDEL
      - type: text
      - value: '{röstningslokal.FÖRSTORINGSHJALPMEDEL}'
    - label:
      - for: KONTRASTMARKERING
      - text: Kontrastmarkering
    - input:
      - id: KONTRASTMARKERING
      - name: KONTRASTMARKERING
      - type: text
      - value: '{röstningslokal.KONTRASTMARKERING}'
    - label:
      - for: STÄNGT_FÖR_ALLMÄNHETEN
      - text: Stängt för allmänheten
    - input:
      - id: STÄNGT_FÖR_ALLMÄNHETEN
      - name: STÄNGT_FÖR_ALLMÄNHETEN
      - type: text
      - value: '{röstningslokal.STÄNGT_FÖR_ALLMÄNHETEN}'
    - label:
      - for: ÖVRIG_INFO_TILLGÄNGLIGHET
      - text: Övrig information om tillgänglighet
    - input:
      - id: ÖVRIG_INFO_TILLGÄNGLIGHET
      - name: ÖVRIG_INFO_TILLGÄNGLIGHET
      - type: text
      - value: '{röstningslokal.ÖVRIG_INFO_TILLGÄNGLIGHET}'
    - if:
      - röstningslokal:
        - h2:
          - text: Öppettider
        - per:
          - röstningslokal[fält, värde]:
            - if:
              - fält <= 9999-12-31:
                - label:
                  - for: '{fält}'
                  - text: '{fält}'
                - input:
                  - id: '{fält}'
                  - name: '{fält}'
                  - type: text
                  - value: '{värde}'
    - button:
      - text: Spara
