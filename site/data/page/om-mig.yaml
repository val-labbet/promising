- if:
  - user.personnummer:
    - button:
      - text: Logga ut
      - to: user_id
      - value: O
    - dl:
      - dt:
        - text: Namn
      - dd:
        - text: '{user.namn.fnamn} {user.namn.enamn}'
      - dt:
        - text: Personnummer
      - dd:
        - text: '{user.personnummer}'
      - dt:
        - text: Röstlängdsnummer
      - dd:
        - text: '{user.röstlängdsnr.komplett}'
      - dt:
        - text: Riksdag
      - dd:
        - text: '{user.rösträtt.rd}'
      - dt:
        - text: Regionfullmäktige
      - dd:
        - text: '{user.rösträtt.rf}'
      - dt:
        - text: Kommunfullmäktige
      - dd:
        - text: '{user.rösträtt.kf}'
      - dt:
        - text: Folkomröstning
      - dd:
        - text: '{user.rösträtt.fo}'
      - dt:
        - text: Europaparlamentet
      - dd:
        - text: '{user.rösträtt.eu}'
      - dt:
        - text: Sametinget
      - dd:
        - text: '{user.rösträtt.st}'
      - dt:
        - text: Syfte (testperson)
      - dd:
        - text: '{user.syfte}'
    - block-link:
      - href: page:mina-data
      - title: Mina data
      - text: Allt mitt data i råformat
  - else:
    - a:
      - href: page:login
      - text: Logga in
