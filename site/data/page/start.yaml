- h1:
  - span:
    - text: Hej
  - if:
    - axiom.logged-in:
      - span:
        - text: ' {user.namn.fnamn}'
  - span:
    - text: '!'
- p:
  - text: Välkommen till Promising. Det här är starten på allt.
- if:
  - dimension in (V):
    - p:
      - text: Jag är väljare!
    - p:
      - text: Jag ser...
    - ul:
      - li:
        - text: A
- if:
  - dimension in (P):
    - p:
      - text: Jag är parti!
    - p:
      - text: Jag ser...
    - ul:
      - li:
        - text: A
- if:
  - dimension in (F):
    - p:
      - text: Jag är valfunktionär!
    - p:
      - text: Jag ser...
    - ul:
      - li:
        - text: A
- if:
  - dimension in (L):
    - p:
      - text: Jag är lokal valadministratör!
    - p:
      - text: Jag ser...
    - ul:
      - li:
        - text: A
- if:
  - dimension in (R):
    - p:
      - text: Jag är regional valadministratör!
    - p:
      - text: Jag ser...
    - ul:
      - li:
        - text: A
- if:
  - dimension in (C):
    - p:
      - text: Jag är central valadministratör!
    - p:
      - text: Jag ser...
    - ul:
      - li:
        - text: A
- _div:
  - block-link:
    - href: page:väljare
    - title: Jag som väljare
    - text: För dig som vill/får rösta.
  - block-link:
    - href: page:parti
    - title: Jag som partiföreträdare
    - text: För dig som på något sätt representerar ett parti.
  - block-link:
    - href: page:valfunktionär
    - title: Jag som valfunktionär
    - text: För dig som jobbar med valet.
