- h1:
  - span:
    - text: Hej
  - if:
    - axiom.logged-in:
      - span:
        - text: ' {user.namn.fnamn}'
  - span:
    - text: '!'
- p:
  - text: Välkommen till Promising. Det här är starten på allt.
- p:
  - text: Nyheter, todo, kalender
- if:
  - dimension in (V):
    - p:
      - text: Väljare!
  - dimension in (P):
    - p:
      - text: Parti!
  - dimension in (F):
    - p:
      - text: Valfunktionär!
  - dimension in (L):
    - p:
      - text: Lokal valadministratör!
  - dimension in (R):
    - p:
      - text: Regional valadministratör!
  - dimension in (C):
    - p:
      - text: Central valadministratör!
- _div:
  - block-link:
    - href: page:väljare
    - title: Jag som väljare
    - text: För dig som vill/får rösta.
  - block-link:
    - href: page:parti
    - title: Jag som partiföreträdare
    - text: För dig som på något sätt representerar ett parti.
  - block-link:
    - href: page:valfunktionär
    - title: Jag som valfunktionär
    - text: För dig som jobbar med valet.
