- p:
  - text: Saknar du din rösträtt? Fyll i en anmälan nedan.
- label:
  - text: Personnummer
- input:
  - to: anmälan.personnummer
  - type: text
- label:
  - text: Anledning till anmälan
- textarea:
  - to: anmälan.anledning
- button:
  - text: Skicka anmälan
  - to: anmälan.skickad
  - value: ja
- span:
  - if:
    - anmälan.skickad:
      - p:
        - text: Anmälan registrerad. Du kommer att kontaktas.
    - else:
      - text: ''
