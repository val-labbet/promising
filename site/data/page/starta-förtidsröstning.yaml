- axiom:
  - id: hittad
  - any:
    - fr.result
    - fr.bud-med-tjnr
- axiom:
  - id: identifierad
  - any:
    - fr.uppgifter
    - fr.intyg
- axiom:
  - id: steg-bild
  - all:
    - axiom.hittad
    - '!fr.bild-ok'
    - '!axiom.identifierad'
- axiom:
  - id: steg-uppgifter
  - all:
    - fr.bild-ok
    - '!axiom.identifierad'
- axiom:
  - id: steg-bud
  - all:
    - fr.error
    - '!fr.bud-med-tjnr'
- component:
  - id: fr-kort
  - div:
    - class: fr-card
    - span:
      - class: fr-card-photo
      - text: 👤
    - span:
      - class: fr-card-text
- component:
  - id: fr-uppgifter
  - p:
    - class: fr-number
    - text: '{fr.sent.personnummer}'
  - if:
    - fr.bud-med-tjnr:
      - p:
        - text: Bud med tjänstgöringsnummer
    - else:
      - p:
        - class: fr-name
        - text: '{fr.result.namn.enamn}'
      - p:
        - class: fr-name
        - text: '{fr.result.namn.fnamn}'
- component:
  - id: fr-val
  - a:
    - class: fr-choice
    - href: '{vars.href}'
    - span:
      - class: fr-choice-icon
      - text: '{vars.icon}'
    - span:
      - text: '{vars.text}'
- component:
  - id: fr-verktyg
  - div:
    - class: fr-tools
    - if:
      - fullscreen:
        - button:
          - text: Lämna helskärm
          - to: fullscreen
          - value: false
      - else:
        - button:
          - text: ⛶ Helskärm
          - to: fullscreen
          - value: '.fr'
    - if:
      - fr:
        - button:
          - text: Avbryt ✕
          - to: fr
          - value: null
- div:
  - class: fr
  - if:
    - axiom.identifierad:
      - div:
        - class: fr-top
        - if:
          - fr.bud-med-tjnr:
            - p:
              - class: fr-task
              - text: Vad vill budet göra?
        - fr-verktyg: []
      - div:
        - class: fr-steps
        - div:
          - class: fr-col fr-register fr-ok
          - p:
            - class: fr-task
            - text: '1. Säkerställ identiteten på personen framför dig'
          - div:
            - span:
              - class: fr-photo
              - text: 👤
            - span:
              - class: fr-card-text
          - fr-uppgifter: []
          - if:
            - fr.intyg:
              - p:
                - class: fr-check
                - text: ✓ Röstmottagare {fr.intyg.intygare} går i god för identiteten
            - else:
              - p:
                - class: fr-check
                - text: ✓ Bilden stämmer
              - p:
                - class: fr-check
                - text: ✓ Uppgifterna stämmer
        - div:
          - class: fr-col fr-choices
          - p:
            - class: fr-task
            - text: '2. Vad vill {fr.result.namn.fnamn || personen framför dig} göra?'
          - if:
            - '!fr.bud-med-tjnr':
              - fr-val:
                - icon: 🗳️
                - text: Lämna sin röst
                - href: page:ta-emot-förtidsröst
          - fr-val:
            - icon: ✉️
            - text: Lämna budröst
            - href: page:ta-emot-förtidsröst
          - if:
            - '!fr.bud-med-tjnr':
              - fr-val:
                - icon: 🪪
                - text: Intyga identitet för en annan person
                - href: page:ta-emot-förtidsröst
    - else:
      - div:
        - class: fr-top
        - p:
          - class: fr-task
          - text: '1. Säkerställ identiteten på personen framför dig'
        - fr-verktyg: []
      - div:
        - class: fr-steps
        - div:
          - class: fr-col fr-person
          - div:
            - class: fr-photo
            - if:
              - fr.bild-ok:
                - span:
                  - class: fr-photo-ok
                  - text: 👤
              - else:
                - span:
                  - text: '?'
          - form:
            - call: folkbokföring
            - to: fr
            - class: fr-search
            - input:
              - name: personnummer
              - type: text
              - aria-label: Personnummer
              - placeholder: Personnummer
              - value: '{fr.sent.personnummer}'
              - autocomplete: 'off'
              - required: null
              - autofocus: null
            - button:
              - text: Sök
        - if:
          - fr.loading:
            - div:
              - class: fr-col fr-register
              - p:
                - class: fr-wait
                - text: Söker i folkbokföringen…
          - axiom.hittad:
            - div:
              - class: fr-col fr-register
              - fr-kort: []
              - fr-uppgifter: []
          - fr.error:
            - div:
              - class: fr-col fr-register
              - p:
                - class: fr-number
                - text: '{fr.sent.personnummer} är inte ett personnummer'
              - button:
                - class: fr-again
                - text: '< Försök igen'
                - to: fr
                - value: null
        - div:
          - class: fr-col fr-questions
          - if:
            - axiom.steg-bild:
              - p:
                - class: fr-question
                - text: Stämmer bilden?
              - p:
                - class: fr-hint
                - text: Jämför personen framför dig med bilden på id-handlingen.
              - button:
                - text: Ja
                - to: fr.bild-ok
                - value: true
              - if:
                - '!fr.bud-med-tjnr':
                  - form:
                    - class: fr-vouch
                    - to: fr.intyg
                    - p:
                      - text: Det finns ingen id-handling, men en röstmottagare går i god för identiteten.
                    - input:
                      - name: intygare
                      - type: text
                      - aria-label: Röstmottagare
                      - placeholder: Röstmottagare
                      - required: null
                    - button:
                      - text: OK
            - axiom.steg-uppgifter:
              - p:
                - class: fr-question
                - text: Stämmer uppgifterna?
              - p:
                - class: fr-hint
                - text: Bekräfta att uppgifterna på skärmen stämmer överens med de uppgifter som finns på id-handlingen.
              - button:
                - text: Ja
                - to: fr.uppgifter
                - value: true
            - axiom.steg-bud:
              - p:
                - text: Gå vidare med {fr.sent.personnummer} som ett tjänstgöringsnummer på ett bud.
              - button:
                - text: OK
                - to: fr.bud-med-tjnr
                - value: true
