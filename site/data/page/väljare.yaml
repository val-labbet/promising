- p:
  - text: Här finns information om din rösträtt och hur du röstar.
- a:
  - class: block-link
  - href: page:rösträtt
  - div:
    - class: block-link-body
    - h2:
      - class: block-link-title
      - text: Min rösträtt
    - if:
      - '!user.personnummer':
        - p:
          - text: Du måste vara inloggad för att se din rösträtt
          - class: block-link-text
      - user.rösträtt:
        - val-chips: []
      - else:
        - p:
          - text: Jag har ingen rösträtt
          - class: block-link-text
- block-link:
  - href: page:rösta
  - title: Jag vill rösta
  - text: Olika sätt att rösta
- block-link:
  - href: page:hur-gick-det
  - text: Valresultatet hos mig
- block-link:
  - href: page:namninsamling
  - title: Namninsamling
  - text: Skriv under namninsamling
- ul:
  - li:
    - text: Klaga, incident, överklaga
  - li:
    - text: Följ min röst
