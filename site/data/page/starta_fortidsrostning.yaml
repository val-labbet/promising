- form:
  - action: null
  - p:
    - text: Börja med att säkerställa identiteten på personen framför dig.
  - sok-persnr:
    - text: Personnummer
  - label:
    - text: Personnummer
  - input:
    - to: fortidsrost.personnummer
    - type: text
    - pattern: (19|20)?[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])-?[0-9]{4}
    - autofocus: autofocus
  - submit:
    - text: Sök
    - to: fortidsrost.registrerad
    - value: ja
