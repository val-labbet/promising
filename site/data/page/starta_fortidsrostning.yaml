- form:
  - action: null
  - p:
    - text: Börja med att säkerställa identiteten på personen framför dig.
- _search-field:
  - in: persons
  - fields:
    - personnummer
    - namn.komplett
  - placeholder: '10 eller 12 siffror'
  - max: 10
  - ul:
    - class: search-hits
    - per:
      - search.hits[v]:
        - li:
          - strong:
            - text: '{v.namn.komplett}'
          - br: []
          - small:
            - text: '{v.personnummer}'
  - if:
    - search.none:
      - p:
        - class: search-empty
        - text: Ingen hittades.
- form:
  - call: folkbokforing
  - to: folkbokford
  - label:
    - for: personnummer
    - text: Nr
  - input:
    - id: personnummer
    - name: personnummer
    - type: text
    - pattern: (19|20)?[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])-?[0-9]{4}
    - placeholder: '10 eller 12 siffror'
    - required: null
  - button:
    - text: Sök
- if:
  - folkbokford.loading:
    - p:
      - text: Söker i folkbokföringen…
  - folkbokford.error:
    - p:
      - class: search-empty
      - text: '{folkbokford.error}'
  - folkbokford.result:
    - p:
      - strong:
        - text: '{folkbokford.result.namn.komplett}'
      - br: []
      - small:
        - text: '{folkbokford.result.personnummer}'
  - folkbokford.done:
    - p:
      - class: search-empty
      - text: Ingen person hittades.
