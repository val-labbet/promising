- p:
  - text: Registrera röster som inte hann behandlas i vallokalen under valdagen.
- form:
  - call: folkbokföring
  - to: efterreg-c
  - label:
    - for: efterreg-c-personnummer
    - text: Personnummer
  - input:
    - id: efterreg-c-personnummer
    - name: personnummer
    - type: text
    - value: '{efterreg-c.sent.personnummer}'
    - required: null
  - label:
    - for: efterreg-c-kommentar
    - text: Kommentar
  - textarea:
    - id: efterreg-c-kommentar
    - name: kommentar
  - button:
    - text: Registrera
- if:
  - efterreg-c.loading:
    - p:
      - text: Registrerar…
  - efterreg-c.error:
    - p:
      - text: '{efterreg-c.error}'
  - efterreg-c.result:
    - p:
      - text: Efterregistrering genomförd centralt för {efterreg-c.result.namn.komplett}.
