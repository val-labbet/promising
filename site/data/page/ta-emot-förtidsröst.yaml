- p:
  - text: Börja med att säkerställa identiteten på personen framför dig.
- label:
  - text: Personnummer
- input:
  - to: förtidsröst.personnummer
  - type: number
  - pattern: (19|20)?[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])-?[0-9]{4}
  - autofocus: autofocus
- button:
  - text: Registrera förtidsröst
  - to: förtidsröst.registrerad
  - value: ja
