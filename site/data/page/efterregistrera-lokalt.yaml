- p:
  - text: Lokal efterregistrering för röster som kräver komplettering på kommunal nivå.
- label:
  - text: Personnummer
- input:
  - to: efterreg-l.personnummer
  - type: text
- label:
  - text: Kommentar
- textarea:
  - to: efterreg-l.kommentar
- button:
  - text: Registrera
  - to: efterreg-l.registrerad
  - value: ja
- span:
  - if:
    - efterreg-l.registrerad:
      - p:
        - text: Efterregistrering genomförd lokalt.
    - else:
      - text: ''
