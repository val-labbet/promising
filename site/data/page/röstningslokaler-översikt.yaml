- p:
  - text: Röstningslokaler för förtidsröstning, per län och kommun.
- funneling-table:
  - in: röstningslokaler.json
  - by: LÄN, KOMMUN
  - name: LOKAL
  - key: LÄNSKOD, KOMMUNKOD, LOKAL, GATUADRESS
  - open: röstningslokaler.öppen
  - total: Totalt
  - item-page: röstningslokal
  - item-param: lokal
- button:
  - text: + Ny röstningslokal
  - to: lokal
  - value: null
  - go: röstningslokal
- h2:
  - text: Hitta en röstningslokal
- search-field:
  - in: röstningslokaler.json
  - fields:
    - LOKAL
    - GATUADRESS
    - ORT
    - KOMMUN
  - placeholder: Sök på ort, adress eller lokal…
  - max: 20
  - ul:
    - class: search-hits
    - per:
      - search.hits[v]:
        - li:
          - a:
            - href: page:röstningslokal?lokal={v.LÄNSKOD}/{v.KOMMUNKOD}/{v.LOKAL}/{v.GATUADRESS}
            - strong:
              - text: '{v.LOKAL}'
            - br: []
            - small:
              - text: '{v.GATUADRESS}, {v.ORT} ({v.KOMMUN})'
  - if:
    - search.none:
      - p:
        - class: search-empty
        - text: Ingen hittades.
