- p:
  - text: Ange personnummer för att kontrollera om en förtidsröst finns registrerad.
- label:
  - text: Personnummer
- input:
  - to: snabbfråga.personnummer
  - type: text
- button:
  - text: Sök
  - to: snabbfråga.sökts
  - value: ja
- span:
  - if:
    - snabbfråga.sökts:
      - p:
        - text: Ingen registrerad förtidsröst hittad för angivet personnummer.
    - else:
      - text: ''
